<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tuck</title>
  <meta name="description" content="Tuck — a dark satirical management sim about the micro-economy of a British schoolyard.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&family=Patrick+Hand&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="style-crayon">
  <main id="game" aria-label="Tuck">
    <canvas id="stage" width="1280" height="720" aria-hidden="true"></canvas>

    <header id="hud">
      <div class="hud-where">
        <span id="hud-act"></span>
        <span id="hud-school"></span>
      </div>
      <div class="hud-clock">
        <span id="hud-day"></span>
        <span id="hud-time"></span>
      </div>
      <div class="hud-money">
        <div><label>Cash</label><span id="hud-cash"></span></div>
        <div title="Hold at least this much. Decency is only available above the line."><label>Quota</label><span id="hud-quota"></span></div>
        <div class="hud-sub"><small id="hud-surplus"></small><small id="hud-target"></small></div>
      </div>
      <div class="hud-meters">
        <div class="meter"><label>Soul</label><div class="bar"><i id="bar-soul"></i></div><span id="val-soul"></span></div>
        <div class="meter"><label>Playground happiness</label><div class="bar"><i id="bar-happy"></i></div><span id="val-happy"></span></div>
        <div class="meter"><label>Market monopoly</label><div class="bar"><i id="bar-mono"></i></div><span id="val-mono"></span></div>
      </div>
      <div class="hud-buttons">
        <button id="btn-ledger" type="button">Ledger</button>
        <button id="btn-speed" type="button" title="Game speed">1×</button>
        <button id="btn-mute" type="button" title="Mute" aria-pressed="false">♪</button>
      </div>
    </header>

    <div id="objective"></div>

    <aside id="feed">
      <h3 id="feed-title"></h3>
      <ol id="feed-list"></ol>
    </aside>

    <div id="fx" aria-hidden="true"></div>

    <section id="dialogue" hidden aria-live="polite">
      <div id="d-speaker"></div>
      <div id="d-text"></div>
      <div id="d-options"></div>
    </section>

    <section id="ledger" hidden>
      <div class="ledger-head">
        <h2>The Ledger</h2>
        <button id="ledger-close" type="button" aria-label="Close ledger">×</button>
      </div>
      <div id="ledger-body"></div>
    </section>

    <section id="freeze" hidden aria-live="polite">
      <h2>STAGNATION</h2>
      <p id="f-reason"></p>
      <p id="f-hint"></p>
      <div id="f-idle"></div>
      <div id="f-log"></div>
      <button id="f-reconsider" type="button">Reconsider</button>
    </section>

    <section id="card" class="card" hidden></section>

    <div id="rotate">Turn your device sideways. The market prefers landscape.</div>
  </main>

  <script src="js/content.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
